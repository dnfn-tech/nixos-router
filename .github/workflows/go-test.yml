name: Go Tests
on:
  push:
    branches:
      - main
      - cursor/feat-backend-m1-16f6
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Run tests
        run: |
          cd backend
          go test ./...
