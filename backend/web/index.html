<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>NixOS 路由器 · 管理面板</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#page-title">跳转到主要内容</a>
    <div id="app">
      <div id="login-view" class="login-view hidden">
        <div class="login-card">
          <div class="brand">◆ NIXOS <span>ROUTER</span></div>
          <h1>管理你的网络</h1>
          <p class="muted">登录路由器管理面板</p>
          <form id="login-form">
            <label for="login-username">用户名</label
            ><input id="login-username" autocomplete="username" required />
            <label for="login-password">密码</label
            ><input
              id="login-password"
              type="password"
              autocomplete="current-password"
              required
            />
            <button id="login-submit" class="btn primary" type="submit">
              登录
            </button>
            <div
              id="login-error"
              class="notice error hidden"
              role="alert"
            ></div>
          </form>
          <p class="small muted">使用设备管理员账户登录</p>
        </div>
      </div>
      <div id="main-view" class="hidden">
        <header class="header">
          <a class="brand" href="#/overview" aria-label="NixOS 路由器总览"
            >◆ NIXOS <span>ROUTER</span></a
          >
          <button
            id="nav-toggle"
            class="btn menu-toggle"
            type="button"
            aria-controls="top-nav"
            aria-expanded="false"
            aria-label="打开导航"
          >
            菜单
          </button>
          <nav id="top-nav" aria-label="主导航"></nav>
          <div class="account">
            <span id="user-display"></span
            ><button id="logout-btn" class="btn quiet">退出</button>
          </div>
        </header>
        <main class="content">
          <nav id="section-tabs" class="tabs" aria-label="分区"></nav>
          <div class="page-heading">
            <div>
              <h1 id="page-title" tabindex="-1">总览</h1>
              <p id="page-description" class="muted"></p>
            </div>
            <button id="page-refresh" class="btn quiet">刷新</button>
          </div>
          <div class="deployment">
            <span id="deployment-mode" class="badge">正在连接</span
            ><span id="deployment-description"></span>
          </div>
          <div
            id="status-banner"
            class="notice error hidden"
            role="alert"
          ></div>
          <section
            id="page-content"
            aria-label="页面内容"
            aria-busy="false"
          ></section>
        </main>
        <footer class="actionbar" aria-label="配置操作">
          <div class="actionbar-inner">
            <div class="save-state">
              <span id="apply-dirty" class="badge warning hidden">未保存</span
              ><span id="save-state">配置已加载</span>
            </div>
            <div class="actions">
              <button id="apply-undo" class="btn quiet" disabled>
                撤销修改</button
              ><button id="apply-save" class="btn" disabled>保存</button
              ><button id="apply-run" class="btn primary">生成配置</button>
            </div>
            <div
              id="apply-msg"
              class="apply-msg hidden"
              role="status"
              aria-live="polite"
            ></div>
          </div>
        </footer>
      </div>
    </div>
    <noscript>请启用 JavaScript 后使用管理面板。</noscript>
  </body>
</html>
